<div class="card-container">
    <div class="section-title" style="text-align: center;">Your Answer Check</div>
    {{type:WordClean}}
    <hr style="border: none; border-top: 1px solid #21262d; margin: 20px 0;">

    <div class="section-title" style="text-align: center;">Correct Word</div>
    <div class="word-title">{{Word}}</div>
    <!-- Dòng luyện đọc chữ viết tay: dùng WordClean (KHÔNG dấu trọng âm) vì
         font Marck Script không có ký tự dấu ghép -> Word có dấu sẽ vỡ phông -->
    <div class="cursive-word">{{WordClean}}</div>
    <div class="audio-box">{{Audio}}</div>

    <div class="badge-container">
        <div class="badge accent">{{PoSFull}}</div>
        {{#GenderBadge}}{{GenderBadge}}{{/GenderBadge}}
    </div>

    <div class="section-title">Meaning</div>
    <div class="meaning-box" style="border-bottom-left-radius: 0; border-bottom-right-radius: 0;">{{Meaning}}</div>

    {{#Vietnamese}}
    <div class="vietnamese-box">
        <div class="vi-label">Tiếng Việt</div>
        <div class="vi-content">{{Vietnamese}}</div>
    </div>
    {{/Vietnamese}}

    {{#ExamplesHTML}}
    <div class="section-title">Context Examples</div>
    <div>{{ExamplesHTML}}</div>
    {{/ExamplesHTML}}
</div>

<!-- ============================================================================
  GHI CHÚ: Nút "AI Refine" + toàn bộ JavaScript gọi AI/AnkiConnect đã được GỠ BỎ
  (từ 2026-07-14) vì chuyển sang kiến trúc VPS:
    - Muốn sửa thẻ: dùng lệnh /sua <từ> <yêu cầu> trong bot Telegram.
    - Lợi ích: API key không còn bị nhúng vào thẻ; prompt/logic chỉ còn 1 nơi
      duy nhất phía Python (ai_client.py + pipeline.refine_note).
  Field RawExamples vẫn được lưu trong note (ẩn, không hiển thị) để bot dùng
  làm ngữ liệu khi sửa thẻ.
============================================================================= -->
